logoSource:
  type: image
  comment: "Logo image source URL or path."
  options:
    resize_style: contain
    width: 1920
    height: 1280
logoAlt:
  type: text
  comment: "Alt text for the logo image for accessibility."
quickLinks:
  type: array
  comment: "Navigation links shown in the Quick Links column (e.g. Blog through Contact Us)."
  options:
    structures:
      values:
        - label: Navigation Link
          icon: link
          value:
            name: ""
            path: ""
            openInNewTab: false
          _inputs:
            name:
              type: text
              comment: "Display text for the navigation link."
            path:
              type: url
              comment: "URL path for the navigation link."
            openInNewTab:
              type: switch
              comment: "Open this link in a new browser tab (useful for external links like Blog or Store)."
newsletterHeading:
  type: text
  comment: "Heading for the newsletter / stay connected column."
newsletterText:
  type: markdown
  comment: "Short description shown beneath the newsletter heading."
newsletterLink:
  type: url
  comment: "URL for the Subscribe button. Leave empty to hide the button."
socials:
  type: array
  comment: "Social media links shown beneath the newsletter content."
  options:
    structures:
      values:
        - label: Social Link
          icon: share
          value:
            icon: ""
            link: ""
            openInNewTab: true
          _inputs:
            icon:
              type: text
              comment: "Icon name for the social media platform (e.g. social/linkedin)."
            link:
              type: url
              comment: "URL to the social media profile."
            openInNewTab:
              type: switch
              comment: "Open this link in a new browser tab (recommended for external social media links)."
footerText:
  type: text
  comment: "Legal / copyright text shown at the bottom of the footer."
