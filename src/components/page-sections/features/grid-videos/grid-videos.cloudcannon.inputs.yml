heading:
  type: text
  comment: Section heading text displayed above the video grid.

videos:
  type: array
  comment: YouTube video embeds to display in the grid.
  options:
    structures: _structures.videoItem

colorScheme:
  type: select
  options:
    values:
      - id: inherit
        name: Inherit
      - id: dark
        name: Dark
      - id: light
        name: Light

backgroundColor:
  type: select
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
