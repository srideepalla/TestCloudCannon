heading:
  type: text
  comment: Section heading shown above the winner search.

description:
  type: text
  comment: Short line of copy explaining what this generates.

apiEndpoint:
  type: url
  comment: >-
    Base URL of the Blog Generator API, with no trailing slash (e.g.
    https://your-tunnel.trycloudflare.com). Leave blank to use the site's
    PUBLIC_BLOG_API_ENDPOINT build setting. A quick-tunnel URL changes every
    time the tunnel restarts, so expect to update this when testing.

# There is deliberately NO winner-picking field here any more. Choosing the
# winner happens on the page itself -- search, select, Generate -- because that
# is where the team wants an editor working, and because 22,958 organizations
# plus 11,537 people is a live search against the API rather than anything that
# can sensibly live in a sidebar dropdown.

showAngle:
  type: checkbox
  comment: >-
    Show the optional "editorial angle" box, which steers what the article is
    about. Turn it off for a strictly one-click flow.

pageSize:
  type: number
  comment: How many winners the search shows at a time.
  options:
    min: 6
    max: 60
    step: 6

emptyStateText:
  type: text
  comment: Message shown before a search has been run.

debug:
  type: checkbox
  comment: >-
    Show a live log panel under the form — every fetch it makes and every
    error, in plain text, right on the page. Turn this on when generation
    isn't working and you need to see why without opening browser devtools.
    Turn it off once things are working; it is not meant to ship visible to
    visitors.

colorScheme:
  type: select
  options:
    values:
      - id: light
        name: Light
      - id: dark
        name: Dark
      - id: inherit
        name: Inherit

backgroundColor:
  type: select
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
