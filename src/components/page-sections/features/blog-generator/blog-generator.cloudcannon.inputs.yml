heading:
  type: text
  comment: Section heading shown above the profile picker.

description:
  type: text
  comment: Short line of copy explaining what this generates.

apiEndpoint:
  type: url
  comment: >-
    Base URL of the Blog Generator API, with no trailing slash (e.g.
    https://your-tunnel.trycloudflare.com). Leave blank to use the site's
    PUBLIC_BLOG_API_ENDPOINT build setting. A quick-tunnel URL changes every
    time the tunnel restarts, so expect to update this when testing. This is
    the StevieIntel server (blog_writer.py), the same one static/blog_writer.html
    talks to locally — not the Search Past Winners API.

winnerProfiles:
  type: multiselect
  comment: >-
    The winners to draft about -- pick as many as you like in one go.
    Organizations and people are in one list, sorted by award count,
    most-awarded first, each tagged "· Organization" or "· Person" so the
    two are easy to tell apart while picking. Saving drafts every profile
    here that hasn't already been drafted from this page; adding more later
    and saving again only drafts the new ones. Sourced from
    src/data/blogWinnerProfiles.json (see data_config in cloudcannon.config.yml)
    rather than an inline _select_data list -- 1,449 entries inlined there
    bloated that file past the point where CloudCannon's git sync kept
    working for any page.
  options:
    values: data.blogWinnerProfiles

emptyStateText:
  type: text
  comment: Message shown before a profile has been picked.

debug:
  type: checkbox
  comment: >-
    Show a live log panel under the form — every fetch it makes and every
    error, in plain text, right on the page. Turn this on when generation
    isn't working and you need to see why without opening browser devtools.
    Turn it off once things are working; it is not meant to ship visible to
    visitors.

colorScheme:
  type: select
  options:
    values:
      - id: inherit
        name: Inherit
      - id: dark
        name: Dark
      - id: light
        name: Light

backgroundColor:
  type: select
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
