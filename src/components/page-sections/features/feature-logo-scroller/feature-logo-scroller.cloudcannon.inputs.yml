heading:
  type: text
  comment: Section heading text displayed above the logo scroller.

description:
  type: markdown
  comment: Centered description text below the heading.
  options:
    bold: true
    italic: true
    link: true

logos:
  type: array
  comment: Company logos to display in the scrolling marquee.
  options:
    structures: _structures.logoItem

colorScheme:
  type: select
  options:
    values:
      - id: inherit
        name: Inherit
      - id: light
        name: Light
      - id: dark
        name: Dark

backgroundColor:
  type: select
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
