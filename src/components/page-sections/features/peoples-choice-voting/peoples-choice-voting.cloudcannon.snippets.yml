peoples_choice_voting:
  template: mdx_component
  inline: false
  preview:
    text:
      - People's Choice Voting
    subtext:
      - key: heading
    icon: how_to_vote
  definitions:
    component_name: PeoplesChoiceVoting
    named_args:
      - editor_key: heading
        type: string
        optional: true
        remove_empty: true
      - editor_key: description
        type: string
        optional: true
        remove_empty: true
      - editor_key: apiBaseUrl
        type: string
        optional: true
        remove_empty: true
      - editor_key: mode
        type: string
        optional: true
        remove_empty: true
      - editor_key: testingMode
        type: boolean
        optional: true
      - editor_key: programId
        type: number
        optional: true
      - editor_key: campaignId
        type: number
        optional: true
      - editor_key: showCampaign
        type: boolean
        optional: true
      - editor_key: showSort
        type: boolean
        optional: true
      - editor_key: debug
        type: boolean
        optional: true
      - editor_key: colorScheme
        type: string
        optional: true
        remove_empty: true
      - editor_key: backgroundColor
        type: string
        optional: true
        remove_empty: true
      - editor_key: paddingVertical
        type: string
        optional: true
        remove_empty: true
  _inputs_from_glob:
    - /src/components/page-sections/features/peoples-choice-voting/peoples-choice-voting.cloudcannon.inputs.yml
