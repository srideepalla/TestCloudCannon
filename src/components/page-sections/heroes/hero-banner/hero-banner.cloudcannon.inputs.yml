heading:
  type: text
  comment: Large centered heading text.

text:
  type: markdown
  comment: Body text displayed below the heading.
  options:
    bold: true
    italic: true
    link: true

colorScheme:
  type: select
  options:
    values:
      - id: inherit
        name: Inherit
      - id: dark
        name: Dark
      - id: light
        name: Light

backgroundColor:
  type: select
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
