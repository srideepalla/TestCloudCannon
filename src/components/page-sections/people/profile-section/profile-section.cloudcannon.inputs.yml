jsonFile:
  type: file
  comment: >-
    Optional, higher priority than the data field below. Upload a .json
    file containing the profile data — same shape as an entry in the
    Profiles collection. Read directly from disk at build time, so no
    network request is made for this.
  options:
    accepts_mime_types:
      - application/json
    paths:
      uploads: public/data/profiles
      static: public
data:
  type: code
  syntax: json
  comment: >-
    Optional, used if jsonFile is empty or fails to parse. Paste profile
    JSON directly. Same shape as an entry in the Profiles collection — see
    src/content/profiles/*.json for examples (name, headline, summary,
    badge, photo, socialLinks, details, tags, sections, etc.).
colorScheme:
  type: select
  comment: Color scheme theme for this profile section.
  options:
    values:
      - id: light
        name: Light
      - id: dark
        name: Dark
