label: Card Carousel
icon: view_carousel
description: Logo thumbnail selector with synced content carousel showing cards with unique colors.
value:
  _component: page-sections/carousels/card-carousel
  heading: Explore Other Stevie Awards Competitions
  description: ""
  cards:
    - logo:
        source: ""
        alt: ""
      eventPhoto:
        source: ""
        alt: ""
      dateLabel: "2024"
      name: Award Name
      description: Description of the award.
      link: ""
      brandColor: "#003366"
  colorScheme: inherit
  backgroundColor: base
preview:
  text:
    - Card Carousel
  subtext:
    - key: heading
  icon: view_carousel
picker_preview:
  text: Card Carousel
  subtext: Logo thumbnail selector with synced content carousel showing cards with unique colors.
_inputs_from_glob:
  - /src/components/page-sections/carousels/card-carousel/card-carousel.cloudcannon.inputs.yml
_structures:
  card:
    values:
      - label: Card
        value:
          logo:
            source: ""
            alt: ""
          eventPhoto:
            source: ""
            alt: ""
          dateLabel: ""
          name: ""
          description: ""
          link: ""
          colorScheme: inherit
          brandColor: "#003366"
          textColor: ""
          subtitleColor: ""
          accentColor: ""
          buttonColor: ""
        preview:
          text:
            - key: name
          subtext:
            - key: dateLabel
        _inputs:
          logo:
            type: object
            comment: Logo image used in the thumbnail selector.
          logo.source:
            type: image
            comment: Logo image file.
            options:
              paths:
                uploads: src/assets/images
          logo.alt:
            type: text
            comment: Alt text for the logo.
          eventPhoto:
            type: object
            comment: Event photo displayed on the left side of the content card.
          eventPhoto.source:
            type: image
            comment: Event photo file.
            options:
              paths:
                uploads: src/assets/images
          eventPhoto.alt:
            type: text
            comment: Alt text for the event photo.
          dateLabel:
            type: text
            comment: 'Date, year, or status label shown above the program name (e.g. "March 31, 2026", "2026", or "NOW"). Rendered after the "ENTRIES OPEN:" prefix.'
          name:
            type: text
            comment: Award program name.
          description:
            type: markdown
            comment: Description of the award program.
            options:
              bold: true
              italic: true
              link: true
          link:
            type: url
            comment: URL for the Learn More link.
          colorScheme:
            type: select
            comment: Color scheme for the card.
            options:
              values:
                - id: inherit
                  name: Inherit
                - id: light
                  name: Light
                - id: dark
                  name: Dark
          brandColor:
            type: color
            comment: >-
              Card panel background color. Use the official brand hex for each
              Stevie program. Verified presets: IBA Navy #003366, SAWIB Gold
              #DFBA19. For ABA, ASIA, GSA, MENA, HR, Sales, Tech, SAGE — confirm
              the official hex from the program's brand guide / live site
              before using.
          textColor:
            type: color
            comment: >-
              Optional color for the heading (program name). Falls back to the
              default contrast color (typically white) on the brand background.
          subtitleColor:
            type: color
            comment: >-
              Optional color for the subtitle / description text. Falls back to
              the heading color above, then to the default contrast color.
          accentColor:
            type: color
            comment: >-
              Optional color for the "ENTRIES OPEN" date label above the
              heading. Leave empty to use the site's primary brand color.
          buttonColor:
            type: color
            comment: >-
              Optional color for the call-to-action button text. Leave empty to
              use the site's primary brand color.
