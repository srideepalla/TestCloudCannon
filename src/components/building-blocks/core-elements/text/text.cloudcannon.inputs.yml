text:
  comment: The content for the text component (Markdown format). Leave empty to use slot content instead.
  type: markdown
  options:
    blockquote: false
    bold: true
    format: p h1 h2 h3 h4 h5 h6 pre
    italic: true
    link: true
    strike: false
    subscript: true
    superscript: true
    underline: false
    bulletedlist: true
    numberedlist: true
    indent: true
    outdent: true
    alignleft: true
    aligncenter: true
    alignright: true
    alignjustify: true
    styles: /.cloudcannon/styles/editor.css
size:
  type: select
  comment: Controls the body text size and shifts heading sizes up or down the heading token scale accordingly.
  options:
    values:
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large

alignX:
  type: select
  options:
    values:
      - id: start
        name: Start
      - id: center
        name: Center
      - id: end
        name: End
  comment: The horizontal alignment of the text component.
