source:
  type: image
  comment: The URL or path to the image.
  options:
    paths:
      uploads: src/assets/images
      static: ""
    resize_style: contain
    width: 1920
    height: 1280
alt:
  type: textarea
  comment: >-
    Required. Describe what the image shows and why it matters here, as a
    sentence — someone using a screen reader, or anyone whose image fails to
    load, gets this instead of the picture. Name the award, programme, people or
    place where relevant rather than writing "image" or "logo". The build also
    checks this, so a missing description fails the build rather than shipping
    silently.
  options:
    required: true
link:
  type: url
  comment: >-
    Optional. Make the image clickable by entering a URL — visitors who click
    the image will be sent here. Leave empty for a non-clickable image.
openInNewTab:
  type: switch
  comment: When the image is linked, open the destination in a new browser tab.
sizes:
  type: text
  comment: Responsive sizes attribute for the image.
  hidden: true
widths:
  type: array
  comment: Responsive width candidates used to generate image variants.
  hidden: true
width:
  type: number
  comment: Optional explicit image width in pixels.
  hidden: true
height:
  type: number
  comment: Optional explicit image height in pixels.
  hidden: true
displayWidth:
  type: select
  comment: The display width of the image within its container.
  options:
    values:
      - id: "100"
        name: Full width
      - id: "50"
        name: Half width
maxWidth:
  type: number
  comment: >-
    Optional. Maximum display width of the image in pixels (e.g. 240 for a
    logo). The image never grows wider than this; height scales automatically
    to keep the aspect ratio. Leave empty for no pixel limit. Use the alignment
    option to position it left, center, or right.
alignX:
  type: select
  comment: Horizontal alignment of the image when narrower than its container.
  options:
    default: "center"
    values:
      - id: start
        name: Left
      - id: center
        name: Center
      - id: end
        name: Right
rounded:
  type: switch
  comment: Whether to apply rounded corners to the image.
aspectRatio:
  type: select
  comment: Set a fixed aspect ratio for the image.
  options:
    values:
      - id: none
        name: None
      - id: square
        name: Square (1:1)
      - id: landscape
        name: Landscape (4:3)
      - id: portrait
        name: Portrait (3:4)
      - id: widescreen
        name: Widescreen (16:9)
      - id: horizontal-strip
        name: Horizontal Strip (16:5)
positionVertical:
  type: select
  comment: Vertical positioning of the image within the container (if aspect ratio is set).
  options:
    values:
      - id: top
        name: Top
      - id: center
        name: Center
      - id: bottom
        name: Bottom
positionHorizontal:
  type: select
  comment: Horizontal positioning of the image within the container (if aspect ratio is set).
  options:
    values:
      - id: left
        name: Left
      - id: center
        name: Center
      - id: right
        name: Right
background:
  type: switch
  hidden: true
  comment: Covers the entire parent container with the image.
priority:
  type: switch
  comment: Load the image with high priority (eager loading for above-the-fold images).
