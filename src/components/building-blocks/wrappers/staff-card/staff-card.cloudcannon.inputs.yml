photo:
  type: object
  comment: Profile photo for the staff member.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Profile Photo
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
photo.source:
  type: image
  comment: URL or path to the profile photo.
  options:
    paths:
      uploads: src/assets/images
photo.alt:
  type: text
  comment: Alt text for the profile photo.
heading:
  type: text
  comment: Staff member's name.
jobTitle:
  type: text
  comment: Staff member's job title or role.
description:
  type: markdown
  comment: Staff member's biography.
  options:
    bold: true
    italic: true
    link: true
colorScheme:
  type: select
  options:
    values:
      - id: inherit
        name: Inherit
      - id: dark
        name: Dark
      - id: light
        name: Light
backgroundColor:
  type: select
  comment: Card background colour.
  options:
    values:
      - id: none
        name: None
      - id: base
        name: Base
      - id: surface
        name: Surface
      - id: accent
        name: Accent
      - id: highlight
        name: Highlight
