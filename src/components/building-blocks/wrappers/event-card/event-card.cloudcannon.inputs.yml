eventPhoto:
  type: object
  comment: The event's main photo shown in the card.
  options:
    preview:
      icon: image
      text:
        - key: alt
        - Event Photo
      subtext:
        - key: source
        - Add an image source
      image:
        - key: source
eventPhoto.source:
  type: image
  comment: URL or path to the event photo.
  options:
    paths:
      uploads: src/assets/images
eventPhoto.alt:
  type: text
  comment: Alt text for the event photo.
dateLabel:
  type: text
  comment: 'Date, deadline text, or status shown above the event name (e.g. "March 31, 2026" or "NOW"). Rendered after the "ENTRIES OPEN:" prefix.'
name:
  type: text
  comment: Name of the event or awards program.
description:
  type: markdown
  comment: Short description of the event.
link:
  type: url
  comment: URL for the "Learn More" button. Leave empty to hide the button.
brandColor:
  type: color
  comment: Background color of the text panel.
textColor:
  type: color
  comment: Heading text color. Leave empty for default contrast color.
subtitleColor:
  type: color
  comment: Subtitle/description text color. Leave empty to inherit from textColor.
accentColor:
  type: color
  comment: Color for the small label above the heading. Leave empty to use brand color.
buttonColor:
  type: color
  comment: Color for the call-to-action button text. Leave empty to use brand color.
