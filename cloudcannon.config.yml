  data:
    path: src/data
    glob:
      - "**/*.json"
    icon: database
    disable_url: true
    _enabled_editors:
      - data
      - content
    _inputs:
      logoSource:
        type: image
        comment: "Logo image source URL or path."
        options:
          resize_style: contain
          width: 1920
          height: 1280
      logoAlt:
        type: text
        comment: "Alt text for the logo image for accessibility."
      quickLinks:
        type: array
        comment: "Navigation links shown in the Quick Links column (e.g. Blog through Contact Us)."
        options:
          structures:
            values:
              - label: Navigation Link
                icon: link
                value:
                  name: ""
                  path: ""
                  openInNewTab: false
                _inputs:
                  name:
                    type: text
                    comment: "Display text for the navigation link."
                  path:
                    type: url
                    comment: "URL path for the navigation link."
                  openInNewTab:
                    type: switch
                    comment: "Open this link in a new browser tab (useful for external links like Blog or Store)."
      newsletterHeading:
        type: text
        comment: "Heading for the newsletter / stay connected column."
      newsletterText:
        type: markdown
        comment: "Short description shown beneath the newsletter heading."
      newsletterLink:
        type: url
        comment: "URL for the Subscribe button. Leave empty to hide the button."
      socials:
        type: array
        comment: "Social media links shown beneath the newsletter content."
        options:
          structures:
            values:
              - label: Social Link
                icon: share
                value:
                  icon: ""
                  url: ""
                _inputs:
                  icon:
                    type: text
                    comment: "Icon name for the social media platform (e.g. social/linkedin)."
                  url:
                    type: url
                    comment: "URL to the social media profile."
      footerText:
        type: text
        comment: "Legal / copyright text shown at the bottom of the footer."
      links:
        type: array
        comment: "Sidebar navigation links shown beneath the section heading."
        options:
          structures:
            style: modal
            values:
              - label: Sidebar Navigation Link
                icon: link
                description: A link in the sidebar menu (e.g. About Us, FAQ, Staff).
                value:
                  text: ""
                  href: ""
                preview:
                  text:
                    - key: text
                    - Sidebar Link
                  subtext:
                    - key: href
                    - Add a URL
                picker_preview:
                  text: Sidebar Navigation Link
                  subtext: A link in the sidebar menu for an About / Awards / Press section.
                  icon: link
                _inputs:
                  text:
                    type: text
                    comment: "Display text for the sidebar link (e.g. 'About Us')."
                  href:
                    type: url
                    comment: "URL path for the sidebar link (e.g. '/about/about-us')."
                    options:
                      hide_link_to_email_address: true
                      hide_link_to_telephone: true
      heading:
        type: text
        comment: "Heading shown above this group of sidebar links (e.g. 'About', 'Awards')."
      navbarBgColor:
        type: color
        label: "Navbar Background Color"
        comment: "Background color for the main navigation bar. This applies globally across both light and dark themes."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBrand:
        type: color
        label: "Primary Brand Color"
        comment: "Primary brand color. Drives buttons, links, focus rings, and any other brand-emphasis surfaces (unless that token is set explicitly below)."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBrandMuted:
        type: color
        label: "Brand Muted (hover)"
        comment: "Slightly darker shade of the brand color. Drives hover/active states for links and brand buttons (unless overridden below)."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBrandSubtle:
        type: color
        label: "Brand Subtle"
        comment: "Subtle brand color for backgrounds and low-emphasis elements."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBrandOn:
        type: color
        label: "Text on Brand"
        comment: "Text/icon color that appears on brand-colored backgrounds."
        options:
          format: hex
          alpha: true
        cascade: true
      colorText:
        type: color
        label: "Body Text"
        comment: "Default text color for body content."
        options:
          format: hex
          alpha: true
        cascade: true
      colorTextStrong:
        type: color
        label: "Strong Text"
        comment: "High-emphasis text color for headings and important content."
        options:
          format: hex
          alpha: true
        cascade: true
      colorTextMuted:
        type: color
        label: "Muted Text"
        comment: "De-emphasized text color for secondary information."
        options:
          format: hex
          alpha: true
        cascade: true
      colorTextOnMuted:
        type: color
        label: "Text on Muted"
        comment: "Text color that appears on muted backgrounds."
        options:
          format: hex
          alpha: true
        cascade: true
      colorTextOnBrand:
        type: color
        label: "Text on Brand Buttons"
        comment: "Text color on primary buttons and brand backgrounds."
        options:
          format: hex
          alpha: true
        cascade: true
      colorTextInverse:
        type: color
        label: "Inverse Text"
        comment: "Text color for inverted/contrast sections."
        options:
          format: hex
          alpha: true
        cascade: true
      colorLink:
        type: color
        label: "Link Color"
        comment: "Default hyperlink text color."
        options:
          format: hex
          alpha: true
        cascade: true
      colorLinkHover:
        type: color
        label: "Link Hover"
        comment: "Hyperlink color on hover."
        options:
          format: hex
          alpha: true
        cascade: true
      colorLinkStrong:
        type: color
        label: "Strong Link"
        comment: "High-emphasis link color for call-to-action links."
        options:
          format: hex
          alpha: true
        cascade: true
      colorLinkStrongHover:
        type: color
        label: "Strong Link Hover"
        comment: "High-emphasis link hover color."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBg:
        type: color
        label: "Page Background"
        comment: "Main page background color."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBgSurface:
        type: color
        label: "Surface Background"
        comment: "Background color for cards, panels, and elevated surfaces."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBgMuted:
        type: color
        label: "Muted Background"
        comment: "Subtle background color for sections and containers."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBgAccent:
        type: color
        label: "Accent Background"
        comment: "Background color for the ccent sections. Leave empty to inherit the Primary Brand Color."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBgHighlight:
        type: color
        label: "Highlight Background"
        comment: "Background color for highlighted or selected items."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBgInverse:
        type: color
        label: "Inverse Background"
        comment: "Background color for inverted/contrast sections."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBorder:
        type: color
        label: "Border Color"
        comment: "Default border color for elements."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBorderInputs:
        type: color
        label: "Input Border"
        comment: "Border color for form inputs and textareas."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBorderStrong:
        type: color
        label: "Strong Border"
        comment: "High-contrast border color for emphasis."
        options:
          format: hex
          alpha: true
        cascade: true
      colorBorderSubtle:
        type: color
        label: "Subtle Border"
        comment: "Low-contrast border color for dividers."
        options:
          format: hex
          alpha: true
        cascade: true
      colorStateHover:
        type: color
        label: "Hover State"
        comment: "Overlay color for hover states."
        options:
          format: hex
          alpha: true
        cascade: true
      colorStateActive:
        type: color
        label: "Active State"
        comment: "Overlay color for active/pressed states."
        options:
          format: hex
          alpha: true
        cascade: true
      colorOverlay:
        type: color
        label: "Overlay"
        comment: "Semi-transparent overlay for modals and backdrops."
        options:
          format: hex
          alpha: true
        cascade: true
      colorFocusRing:
        type: color
        label: "Focus Ring"
        comment: "Outline color for keyboard focus indicators."
        options:
          format: hex
          alpha: true
        cascade: true
      colorError:
        type: color
        label: "Error Color"
        comment: "Color for error messages and validation."
        options:
          format: hex
          alpha: true
        cascade: true
      openInNewTab:
        type: switch
        comment: "Open this link in a new browser tab."
        cascade: true
      events:
        type: array
        comment: >-
          Calendar events. "Event Title" is the main text and shows on the calendar
          page (/About/Calendar). The homepage deadline cards reuse the Event Title
          automatically — so updating a deadline usually means editing ONE field.
          Only fill in "Homepage Short Label" when the full title is too long for a
          card. The homepage hides past events automatically each day; the calendar
          page always lists every event, past and upcoming.
        options:
          structures:
            values:
              - label: Calendar Event
                icon: event
                value:
                  date: ""
                  title: ""
                  label: ""
                  description: ""
                _inputs:
                  date:
                    type: text
                    comment: >-
                      Event date in ISO format (e.g. 2026-06-28T00:00:00.000Z). Once this date
                      passes, the event drops off the homepage automatically (it stays listed on the calendar page).
                  title:
                    type: text
                    label: Event Title (required)
                    comment: >-
                      Main event text. Shown on the calendar page (/About/Calendar), and
                      also used on the homepage deadline cards unless "Homepage Short Label"
                      below is filled in.
                  label:
                    type: text
                    label: Homepage Short Label (optional)
                    comment: >-
                      Optional shorter wording for the small homepage deadline cards. If
                      left blank, the homepage automatically uses the Event Title. Only fill
                      this in when the full title is too long for a card.
                  description:
                    type: text
                    label: Description (optional)
                    comment: Supporting line shown under the title on the calendar page only.
      footerText:
        type: markdown
      href:
        type: url
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
file_config:
  - glob: /src/data/sidebarAd.json
    _inputs:
      enabled:
        type: switch
        comment: >-
          Show the ad below the sidebar navigation. Turn this off to hide the ad on
          every page that has a sidebar, without deleting the tag below.
      html:
        type: textarea
        label: Ad Tag
        comment: >-
          The full ad tag markup (including its <script> tags), pasted exactly as
          supplied by the ad provider. To swap in a different ad, replace this whole
          value — most often only the aj_adspot and aj_dim IDs change.
      aspectRatio:
        type: select
        comment: >-
          Shape of the box the ad is placed in. "square" matches the current
          125x125 sidebar banner.
        options:
          values:
            - square
            - landscape
            - portrait
            - widescreen
  - glob: /src/data/quickActions.json
    _inputs:
      heading:
        type: text
        comment: The heading for the quick actions (menu from button on bottom right of screen) section.
      links:
        type: array
        comment: The links for the quick actions (menu from button on bottom right of screen) section.
        options:
          structures:
            values:
              - label: Navigation Link
                icon: link
                value:
                  text: ""
                  href: ""
                  openInNewTab: false
                _inputs:
                  text:
                    type: text
                    comment: "Display text for the navigation link."
                  href:
                    type: url
                    comment: "URL path for the navigation link."
                  openInNewTab:
                    type: switch
                    comment: "Open this link in a new browser tab (useful for external links like Blog or Store)."
_inputs:
  pageSections:
    comment: The main sections of the page.
    cascade: true
  sidebarBlocks:
    type: array
    comment: Additional content blocks to display in the sidebar below the navigation. The navigation can be edited from the [sidebar nav data file](cloudcannon:collections/pages:/edit?collection=data:/edit?collection=data&path=%2Fsrc%2Fdata%2FsidebarNav.json&schema=false&editor=data)
    options:
      structures: _structures.sidebarBlocks
    cascade: true
  logoSource:
    type: image
    cascade: true
  $.tags:
    type: multiselect
    cascade: true
  $.categories:
    type: multiselect
    cascade: true
  $.pageHeading:
    type: text
    comment: >-
      The h1 of the page content - falls back to title if no value provided.


      Note that a save/rebuild is required to switch between title/pageHeading
      in the editor.
    cascade: true
  $.title:
    type: text
    comment: >-
      Page title for SEO. Also for the h1 of the page content if no Page Heading
      value.
    cascade: true
  $.description:
    type: textarea
    comment: >-
      Page description for SEO.
    cascade: true
  $.image:
    type: image
    comment: >-
      Page image for SEO.
    cascade: true
