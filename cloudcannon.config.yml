collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
      - "**/*.mdx"
    icon: web
    url: /[full_slug]/
    disable_url: false
    _enabled_editors:
      - visual
      - content
      - data
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
        cascade: true
    add_options:
      - name: Add New Page
        icon: pages
        schema: default
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    new_preview_url: /
    schemas:
      default:
        path: .cloudcannon/schemas/page.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Page
      sidebar:
        path: .cloudcannon/schemas/sidebarPage.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Sidebar Page
